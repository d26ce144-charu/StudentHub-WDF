<main class="container">

    <section
        class="form-card"
        aria-labelledby="feedback-title"
    >

        <h2
            class="page-title"
            id="feedback-title"
        >
            Student Feedback
        </h2>


        <p class="page-intro">
            Your feedback helps us improve the StudentHub portal.
        </p>


        <form
            id="feedbackForm"
            action="php/feedback.php"
            method="POST"
        >

            <div class="form-group">

                <label for="feedback-name">
                    Name
                </label>

                <input
                    type="text"
                    id="feedback-name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <fieldset class="rating-group">

                <legend>
                    Rating
                </legend>


                <div class="rating-option">

                    <input
                        type="radio"
                        id="rating1"
                        name="rating"
                        value="1"
                        required
                    >

                    <label for="rating1">
                        1 - Poor
                    </label>

                </div>


                <div class="rating-option">

                    <input
                        type="radio"
                        id="rating2"
                        name="rating"
                        value="2"
                    >

                    <label for="rating2">
                        2 - Fair
                    </label>

                </div>


                <div class="rating-option">

                    <input
                        type="radio"
                        id="rating3"
                        name="rating"
                        value="3"
                    >

                    <label for="rating3">
                        3 - Good
                    </label>

                </div>


                <div class="rating-option">

                    <input
                        type="radio"
                        id="rating4"
                        name="rating"
                        value="4"
                    >

                    <label for="rating4">
                        4 - Very Good
                    </label>

                </div>


                <div class="rating-option">

                    <input
                        type="radio"
                        id="rating5"
                        name="rating"
                        value="5"
                    >

                    <label for="rating5">
                        5 - Excellent
                    </label>

                </div>

            </fieldset>


            <div class="form-group">

                <label for="feedback-message">
                    Your Feedback
                </label>

                <textarea
                    id="feedback-message"
                    name="feedback"
                    placeholder="Write your feedback here..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Submit Feedback
            </button>


            <p
                id="feedbackMessage"
                class="form-message"
                role="alert"
            ></p>

        </form>

    </section>

</main>
