        Discover upcoming academic and student activities.
    </p>


    <section class="event-tools" aria-label="Search and filter events">
        <div class="form-group">
            <label for="eventSearch">Search events</label>
            <input type="search" id="eventSearch" placeholder="Search by name, venue, or description">
        </div>
        <div class="form-group">
            <label for="eventCategory">Category</label>
            <select id="eventCategory">
                <option value="all">All categories</option>
            </select>
        </div>
        <div class="form-group">
            <label for="eventSort">Sort by</label>
            <select id="eventSort">
                <option value="date-asc">Date: soonest first</option>
                <option value="date-desc">Date: latest first</option>
                <option value="title-asc">Name: A to Z</option>
                <option value="title-desc">Name: Z to A</option>
            </select>
        </div>
    </section>
    <p id="eventStatus" class="event-status" role="status">Loading events...</p>
    <section class="event-list" aria-label="Upcoming student events" id="eventList"></section>
    <nav class="pagination" id="eventPagination" aria-label="Event pages"></nav>
